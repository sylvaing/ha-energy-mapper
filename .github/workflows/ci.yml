name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Core tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12: minimum supported; 3.13: add-on base image and current Home Assistant
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        if: hashFiles('tests/test_*.py') != ''
        run: python -m unittest discover -s tests -v

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: present
        run: echo "yes=$([ -f custom_components/energy_mapper/manifest.json ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.present.outputs.yes == '1'
        with:
          # the Python of the Home Assistant release pinned by requirements_test.txt
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install the Home Assistant test environment
        if: steps.present.outputs.yes == '1'
        run: pip install -r requirements_test.txt
      - name: pytest
        if: steps.present.outputs.yes == '1'
        run: python -m pytest -v

  integration:
    name: Integration (hassfest, HACS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: present
        run: echo "yes=$([ -f custom_components/energy_mapper/manifest.json ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: hassfest
        if: steps.present.outputs.yes == '1'
        uses: home-assistant/actions/hassfest@master
      - name: HACS validation
        if: steps.present.outputs.yes == '1'
        uses: hacs/action@22.5.0
        with:
          category: integration
          ignore: brands

  addon:
    name: Add-on (lint, build ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - id: present
        run: echo "yes=$([ -f energy_mapper/config.yaml ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Add-on linter
        if: steps.present.outputs.yes == '1' && matrix.arch == 'amd64'
        uses: frenck/action-addon-linter@v2
        with:
          path: ./energy_mapper
      - id: version
        if: steps.present.outputs.yes == '1'
        run: |
          version=$(grep -m1 '^version:' energy_mapper/config.yaml | cut -d: -f2 | tr -d ' "')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # test build only: nothing is pushed or signed
      - name: Test build
        if: steps.present.outputs.yes == '1'
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ./energy_mapper
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-energy_mapper
          image-tags: test
          version: ${{ steps.version.outputs.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: "false"
          cosign: "false"
          load: "true"
      - name: Smoke test (the image starts and imports the service)
        if: steps.present.outputs.yes == '1'
        run: |
          docker run --rm --entrypoint python3 \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-energy_mapper:test \
            -c "import sys; sys.path.insert(0, '/app'); import main, zoneinfo; zoneinfo.ZoneInfo('Europe/Paris'); print('ok')"

  frontend:
    name: Panel build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: present
        run: echo "yes=$([ -f frontend/package.json ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.present.outputs.yes == '1'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.present.outputs.yes == '1'
        working-directory: frontend
        run: npm ci
      - name: Type check
        if: steps.present.outputs.yes == '1'
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        if: steps.present.outputs.yes == '1'
        working-directory: frontend
        run: npm test
      - name: Build and check the committed bundle is up to date
        if: steps.present.outputs.yes == '1'
        working-directory: frontend
        run: |
          npm run build
          git diff --exit-code -- ../custom_components/energy_mapper/frontend/
