configuration:
  analysis_time:
    name: Analysis time
    description: Local time (HH:MM) of the nightly analysis of the previous day.
  backfill_days:
    name: Backfill days
    description: >-
      How many past days to analyse when they have no report yet (limited by
      what the recorder still holds).
  half_life_days:
    name: Memory half-life (days)
    description: >-
      Age at which a past use counts half when the signatures are learned
      across days. Shorter forgets replaced appliances faster, longer keeps
      rare ones known longer.
  report_retention_days:
    name: Full report retention (days)
    description: >-
      How long the daily reports with their per-minute curve are kept. The
      day summaries are kept as long as they still count for the signatures.
  peak_window_days:
    name: Peak window (days)
    description: >-
      A peak is notable above 80 % of the highest power of this many past
      days, to follow the seasons.
  self_test_devices:
    name: Self-test devices per night
    description: >-
      After the nightly analysis, this many measured devices (sub-meters) are
      hidden in a copy of the analysis to check that the curve finds them
      again. 0 disables the self-test.
  grid_entity:
    name: Grid power sensor
    description: >-
      Leave empty to use the grid meter of the Energy dashboard. Signed power
      (W or kW): positive when importing.
  grid_export_entity:
    name: Grid export power sensor
    description: Only for meters that report import and export as two positive sensors.
  grid_invert:
    name: Invert the grid sign
    description: Enable if the grid sensor is positive when exporting.
  pv_entity:
    name: Solar power sensor
    description: Leave empty to use the solar production of the Energy dashboard.
  battery_entity:
    name: Battery power sensor
    description: Leave empty to use the battery of the Energy dashboard. Positive when discharging.
  battery_invert:
    name: Invert the battery sign
    description: Enable if the battery sensor is positive when charging.
  submeters:
    name: Sub-meters
    description: >-
      Power sensors of measured appliances, subtracted before the analysis.
      Leave empty to use the individual devices of the Energy dashboard.
  switched_loads:
    name: Switched loads
    description: >-
      Appliances driven by a switch (entity_id, optional name and on_states):
      their power is measured from the house meter each time the switch
      changes.
  step_threshold_w:
    name: Step threshold (W)
    description: Smallest power change considered as an appliance switching. Default 300 W.
  night_step_threshold_w:
    name: Night step threshold (W)
    description: >-
      Optional. Smaller steps, down to this value, are also kept while the solar
      panels produce nothing (PV below 20 W in the minute before and after the step).
      Between 50 W and the step threshold. Only with a PV sensor; without one, lower
      the step threshold instead. Empty by default (off).
  adaptive_threshold:
    name: Threshold adapted to the noise of the curve
    description: >-
      Experimental. Power changes smaller than the thresholds above are also
      kept when they stand out of the measured noise of the curve (at least
      40 W and 4 times the noise of the last 30 minutes). Such small uses are
      listed apart in the daily report: they are not proposed for review yet.
      Everything else is analysed as without the option. Off by default.
  peak_threshold_w:
    name: Peak threshold (W)
    description: >-
      Fixed threshold of the notable peaks. Default 80 % of the highest power
      of the peak window (or of the day, when higher).
  live_view:
    name: Live view
    description: >-
      The Live tab of the panel: steps and events as they happen. It runs only
      while someone has the tab open (no cost otherwise); turn it off to
      disable it entirely.
  log_level:
    name: Log level
    description: Verbosity of the add-on log.
