configuration:
  analysis_time:
    name: Heure de l'analyse
    description: Heure locale (HH:MM) de l'analyse nocturne de la veille.
  backfill_days:
    name: Jours de rattrapage
    description: >-
      Nombre de jours passés à analyser s'ils n'ont pas encore de rapport
      (dans la limite de ce que l'enregistreur conserve).
  half_life_days:
    name: Demi-vie de la mémoire (jours)
    description: >-
      Âge auquel une utilisation passée compte pour moitié dans
      l'apprentissage des signatures sur plusieurs jours. Plus court oublie
      plus vite un appareil remplacé, plus long garde plus longtemps les
      appareils rares.
  report_retention_days:
    name: Conservation des rapports complets (jours)
    description: >-
      Durée de conservation des rapports quotidiens avec leur courbe minute
      par minute. Les résumés des jours sont gardés tant qu'ils comptent
      encore pour les signatures.
  peak_window_days:
    name: Fenêtre des pics (jours)
    description: >-
      Un pic est notable au-dessus de 80 % de la puissance la plus haute de ce
      nombre de jours passés, pour suivre les saisons.
  self_test_devices:
    name: Appareils auto-testés par nuit
    description: >-
      Après l'analyse de la nuit, ce nombre d'appareils mesurés (sous-compteurs)
      est caché dans une copie de l'analyse pour vérifier que la courbe les
      retrouve. 0 désactive l'auto-test.
  grid_entity:
    name: Capteur de puissance du réseau
    description: >-
      Laisser vide pour utiliser le compteur réseau du tableau Énergie.
      Puissance signée (W ou kW) : positive en soutirage.
  grid_export_entity:
    name: Capteur de puissance injectée
    description: Seulement pour les compteurs qui donnent soutirage et injection en deux capteurs positifs.
  grid_invert:
    name: Inverser le signe du réseau
    description: À activer si le capteur réseau est positif en injection.
  pv_entity:
    name: Capteur de production solaire
    description: Laisser vide pour utiliser la production solaire du tableau Énergie.
  battery_entity:
    name: Capteur de puissance de la batterie
    description: Laisser vide pour utiliser la batterie du tableau Énergie. Positif en décharge.
  battery_invert:
    name: Inverser le signe de la batterie
    description: À activer si le capteur de la batterie est positif en charge.
  submeters:
    name: Sous-compteurs
    description: >-
      Capteurs de puissance des appareils mesurés, retirés avant l'analyse.
      Laisser vide pour utiliser les appareils individuels du tableau Énergie.
  switched_loads:
    name: Appareils pilotés
    description: >-
      Appareils commandés par un interrupteur (entity_id, nom et on_states
      facultatifs) : leur puissance est mesurée sur le compteur de la maison
      à chaque changement d'état.
  step_threshold_w:
    name: Seuil des marches (W)
    description: Plus petite variation de puissance prise pour un appareil qui s'allume ou s'éteint. 300 W par défaut.
  night_step_threshold_w:
    name: Seuil des marches de nuit (W)
    description: >-
      Facultatif. Des marches plus petites, jusqu'à cette valeur, sont aussi retenues
      quand les panneaux solaires ne produisent rien (PV sous 20 W la minute avant et
      après la marche). Entre 50 W et le seuil des marches. Seulement avec un capteur
      PV ; sans, baissez plutôt le seuil des marches. Vide par défaut (désactivé).
  adaptive_threshold:
    name: Seuil adapté au bruit de la courbe
    description: >-
      Expérimental. Les variations de puissance plus petites que les seuils
      ci-dessus sont aussi retenues quand elles se détachent du bruit mesuré de
      la courbe (au moins 40 W et 4 fois le bruit des 30 dernières minutes). Ces
      petits usages sont listés à part dans le rapport quotidien : ils ne sont
      pas encore proposés à la revue. Tout le reste est analysé comme sans
      l'option. Désactivé par défaut.
  cold_appliances:
    name: Appareils de froid (réfrigérateur, congélateur)
    description: >-
      Expérimental, demande le seuil adapté au bruit. Les petits usages qui
      reviennent régulièrement (un compresseur qui tourne quelques minutes,
      s'arrête, repart) sont appris pendant les heures calmes et suivis toute
      la journée : chaque appareil de ce genre devient une signature à part,
      proposée à la revue. Là où il ne peut pas être suivi, son énergie est
      estimée d'après le rythme appris la nuit, et présentée comme une
      estimation. Désactivé par défaut.
  peak_threshold_w:
    name: Seuil des pics (W)
    description: >-
      Seuil fixe des pics notables. Par défaut 80 % de la puissance la plus
      haute de la fenêtre des pics (ou du jour, si elle est plus haute).
  live_view:
    name: Vue en direct
    description: >-
      L'onglet En direct du panneau : les marches et événements au moment où
      ils arrivent. Elle ne tourne que lorsqu'un onglet est ouvert (aucun coût
      sinon) ; désactivez-la pour la couper complètement.
  log_level:
    name: Niveau de journalisation
    description: Niveau de détail du journal de l'add-on.
