[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"tools/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests_integration"]
pythonpath = ["."]
asyncio_mode = "auto"
